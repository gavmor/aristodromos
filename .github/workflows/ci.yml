name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Every job starts read-only; only `release` widens this.
permissions:
  contents: read

# Pull requests: a new push supersedes the old run. main: runs queue instead of
# cancelling, one at a time in push order, so releases are published in order.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # Applies patches/ and runs `wxt prepare` (postinstall).
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm cpd
      - run: pnpm build
      - run: pnpm zip

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extension-zip
          path: .output/*.zip
          if-no-files-found: error
          retention-days: 14

  release:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # Full history: the tag number is the commit count.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: extension-zip
          path: dist-zip

      - run: .github/scripts/release.sh
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          ZIP_DIR: dist-zip

  # Same script, same artifact, read-only token, nothing published. Runs on
  # pull requests and manual dispatch so the release path is exercised before
  # it ever runs for real.
  release-dry-run:
    needs: ci
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: extension-zip
          path: dist-zip

      - run: .github/scripts/release.sh
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          ZIP_DIR: dist-zip
          DRY_RUN: '1'
