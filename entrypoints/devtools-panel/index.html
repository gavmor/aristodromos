<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Aristodromos</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header>
      <h1>Aristodromos</h1>
      <span id="run-state" class="pill"></span>
      <button id="toggle-tab" type="button"></button>
      <button id="toggle-pause" type="button" title="Pause or resume the agent in every tab it is on for"></button>
      <div class="activity">
        <span id="thinking" class="thinking" role="status" hidden>
          <span class="spinner" aria-hidden="true"></span>
          <span id="thinking-label"></span>
        </span>
        <span id="idle" class="idle" role="status" hidden></span>
        <button id="decide-now" type="button" title="One fresh decision on this tab's page as it is now">
          Decide now
        </button>
      </div>
    </header>

    <section id="status">
      <h2>This tab</h2>
      <dl>
        <dt>Last turn</dt>
        <dd id="last-turn">—</dd>
        <dt>Satisfied</dt>
        <dd id="last-satisfied">—</dd>
        <dt>Remaining</dt>
        <dd id="last-remaining">—</dd>
      </dl>
      <p id="last-error" class="error" hidden></p>
    </section>

    <section id="config-slot">
      <h2>Goal and brain</h2>
    </section>

    <section id="turns">
      <div class="section-head">
        <h2>Turns</h2>
        <label class="inline"><input id="all-tabs" type="checkbox" /> all tabs</label>
        <button
          id="export-run"
          type="button"
          title="This tab's logged run reached its goal: download its System One answers as Jeff training rows (JSONL)"
        >
          Run succeeded: export
        </button>
        <button id="clear-log" type="button">Clear log</button>
      </div>
      <p id="export-note" class="muted" hidden></p>
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Time</th>
            <th>ms</th>
            <th>Via</th>
            <th>Remaining</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="turn-rows"></tbody>
      </table>
      <p id="no-turns" class="muted">No turns yet.</p>
    </section>

    <details id="scene" open>
      <summary>
        <h2>Scene</h2>
        <span id="scene-meta" class="muted"></span>
      </summary>
      <div id="scene-view"></div>
      <p id="no-scene" class="muted">
        No Scene for this tab yet. If the extension was just reloaded, reload the page.
      </p>
    </details>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
